name: OrganicFarm Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push OrganicFarm backend image
        uses: docker/build-push-action@v6
        with:
          context: ./OrganicFarm-Springboot/OrganicFarm-SpringBoot
          file: ./OrganicFarm-Springboot/OrganicFarm-SpringBoot/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: pailavyshnavi2/organicfarm-backend:latest

      - name: Build and push OrganicFarm frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./organicfarm-react
          file: ./organicfarm-react/frontend.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: pailavyshnavi2/organicfarm-frontend:latest
